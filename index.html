<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Enigma</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "7a51e064-6201-45dc-86a3-a701e9f8ef12",
          serviceWorkerParam: { scope: "/Enigma/" },
          serviceWorkerPath: "OneSignalSDKWorker.js"
        });
      } catch (e) {
        console.warn("OneSignal init:", e);
      }
    });
  </script>
  <style>
    :root {
      --bg: #0b0d12;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(212, 175, 55, 0.24);
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.14);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #f87171;
      --own-msg: rgba(212, 175, 55, 0.18);
      --other-msg: rgba(255, 255, 255, 0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #171c28, var(--bg) 60%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ЭКРАН АВТОРИЗАЦИИ */
    #authScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: radial-gradient(circle at top right, #171c28, var(--bg) 65%);
      z-index: 100;
    }
    #authScreen.hidden { display: none; }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: rgba(18, 22, 32, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(16px);
    }
    .auth-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      color: var(--gold);
      background: var(--gold-soft);
      flex-shrink: 0;
    }
    .auth-head h1 {
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .auth-head p {
      font-size: 12px;
      color: var(--muted);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      color: var(--muted);
    }
    .field input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 11px;
      padding: 11px 13px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .field input:focus { border-color: var(--gold); }
    .auth-error {
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }

    /* ОСНОВНОЙ ИНТЕРФЕЙС ЧАТА */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(11, 13, 18, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-wrap h2 {
      font-size: 15px;
      letter-spacing: 1.5px;
      color: var(--gold);
    }
    .status {
      font-size: 11px;
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.97); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }
    .msg.own {
      align-self: flex-end;
      background: var(--own-msg);
      border-color: var(--glass-border);
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: var(--other-msg);
      border-bottom-left-radius: 4px;
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 4px;
      opacity: 0.9;
    }
    .msg-time { color: var(--muted); }
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      max-width: 260px;
      line-height: 1.5;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: rgba(11, 13, 18, 0.92);
      border-top: 1px solid var(--glass-border);
    }
    .composer input {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .composer input:focus { border-color: var(--gold); }
    .send-btn {
      background: var(--gold);
      color: #0b0d12;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* МОДАЛЬНОЕ ОКНО НАСТРОЕК И БЭКАПА */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 410px;
      background: #121620;
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h3 {
      font-size: 16px;
      color: var(--gold);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn.primary {
      background: var(--gold);
      color: #0b0d12;
      border-color: var(--gold);
    }
    .btn.danger {
      border-color: rgba(248, 113, 113, 0.4);
      color: var(--danger);
    }
    .divider {
      height: 1px;
      background: var(--glass-border);
    }
  </style>
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <section id="authScreen">
    <form class="auth-card" id="loginForm">
      <div class="auth-head">
        <div class="logo">E</div>
        <div>
          <h1>ENIGMA</h1>
          <p>Закрытый доступ</p>
        </div>
      </div>

      <div class="field">
        <label>URL веб-приложения Google Apps Script</label>
        <input type="url" id="authGasUrl" placeholder="https://script.google.com/macros/s/.../exec" required />
      </div>

      <div class="field">
        <label>Логин</label>
        <input type="text" id="authLogin" placeholder="nikolay" autocomplete="username" required />
      </div>

      <div class="field">
        <label>Пароль</label>
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <div class="auth-error" id="authError"></div>

      <button type="submit" class="btn primary" id="loginSubmitBtn">Войти в Enigma</button>
    </form>
  </section>

  <!-- ЭКРАН ЧАТА -->
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div class="title-wrap">
        <h2>ENIGMA</h2>
        <div class="status" id="statusText">Подключение...</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="pushBtn" title="Включить пуши">Пуши</button>
      <button class="icon-btn" id="syncBtn" title="Обновить">↻</button>
      <button class="icon-btn" id="settingsBtn" title="Бэкап и выход">⚙</button>
    </div>
  </header>

  <main id="messages">
    <div class="empty-state">Загрузка сообщений...</div>
  </main>

  <form class="composer" id="chatForm">
    <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" required />
    <button type="submit" class="send-btn">→</button>
  </form>

  <!-- НАСТРОЙКИ / БЭКАП / ВЫХОД -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h3>Аккаунт и резервная копия</h3>
      <div class="status" id="accountInfo"></div>

      <div class="divider"></div>
      <div class="field">
        <label>Резервное сохранение переписки (.json)</label>
        <div class="btn-row">
          <button type="button" class="btn" id="exportBackupBtn">⬇ Скачать бэкап (.json)</button>
          <button type="button" class="btn" id="importBackupBtn">⬆ Восстановить .json</button>
          <input type="file" id="importFileInput" accept=".json,application/json" style="display:none" />
        </div>
      </div>

      <div class="divider"></div>
      <div class="btn-row">
        <button type="button" class="btn danger" id="logoutBtn">Выйти из аккаунта</button>
        <button type="button" class="btn" id="closeModalBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "enigma_secure_v2";
    let state = {
      gasUrl: "",
      token: "",
      login: "",
      displayName: "",
      messages: []
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) state = { ...state, ...saved };
    } catch (e) {}

    const authScreen = document.getElementById("authScreen");
    const loginForm = document.getElementById("loginForm");
    const authGasUrl = document.getElementById("authGasUrl");
    const authLogin = document.getElementById("authLogin");
    const authPassword = document.getElementById("authPassword");
    const authError = document.getElementById("authError");
    const loginSubmitBtn = document.getElementById("loginSubmitBtn");

    const messagesEl = document.getElementById("messages");
    const statusText = document.getElementById("statusText");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const settingsModal = document.getElementById("settingsModal");
    const accountInfo = document.getElementById("accountInfo");

    let pollTimer = null;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">");
    }

    async function callApi(payload) {
      const res = await fetch(state.gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function showAuthScreen(errorMsg = "") {
      if (pollTimer) clearInterval(pollTimer);
      authGasUrl.value = state.gasUrl || "";
      authLogin.value = state.login || "";
      authPassword.value = "";
      authError.textContent = errorMsg;
      authScreen.classList.remove("hidden");
    }

    function showChatScreen() {
      authScreen.classList.add("hidden");
      renderMessages();
      syncMessages();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(syncMessages, 8000);
    }

    function renderMessages() {
      if (!state.messages.length) {
        messagesEl.innerHTML = '<div class="empty-state">Сообщений пока нет. Напиши первое сообщение.</div>';
        return;
      }
      messagesEl.innerHTML = state.messages.map(m => {
        const isOwn = (m.login && m.login === state.login) || m.author === state.displayName;
        return `
          <div class="msg ${isOwn ? "own" : "other"}">
            <div class="msg-meta">
              <span>${escapeHtml(m.author || "Участник")}</span>
              <span class="msg-time">${escapeHtml(m.time || "")}</span>
            </div>
            <div>${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join("");
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function syncMessages() {
      if (!state.gasUrl || !state.token) return;
      try {
        const data = await callApi({ action: "get", token: state.token });
        if (!data.ok) {
          if (data.error === "UNAUTHORIZED") {
            state.token = "";
            saveState();
            showAuthScreen("Сессия истекла. Войдите снова.");
          }
          return;
        }
        if (Array.isArray(data.messages)) {
          state.messages = data.messages;
          saveState();
          renderMessages();
        }
        statusText.textContent = `${state.displayName} • в сети`;
      } catch (e) {
        statusText.textContent = "Ошибка соединения";
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError.textContent = "";
      loginSubmitBtn.disabled = true;
      loginSubmitBtn.textContent = "Проверка...";

      state.gasUrl = authGasUrl.value.trim();
      const loginVal = authLogin.value.trim().toLowerCase();
      const passVal = authPassword.value;

      try {
        const data = await callApi({
          action: "login",
          login: loginVal,
          password: passVal
        });

        if (data.ok && data.token) {
          state.token = data.token;
          state.login = loginVal;
          state.displayName = data.displayName || loginVal;
          saveState();
          showChatScreen();
        } else {
          authError.textContent = data.error || "Ошибка входа";
        }
      } catch (err) {
        authError.textContent = "Не удалось связаться со скриптом. Проверь URL и доступ «Все».";
      } finally {
        loginSubmitBtn.disabled = false;
        loginSubmitBtn.textContent = "Войти в Enigma";
      }
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = "";

      const now = new Date();
      const timeStr = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      state.messages.push({
        id: String(Date.now()),
        login: state.login,
        author: state.displayName,
        text,
        time: timeStr
      });
      saveState();
      renderMessages();
      statusText.textContent = "Отправка...";

      try {
        const data = await callApi({
          action: "send",
          token: state.token,
          text: text
        });
        if (!data.ok && data.error === "UNAUTHORIZED") {
          state.token = "";
          saveState();
          showAuthScreen("Сессия истекла. Войдите снова.");
          return;
        }
        await syncMessages();
      } catch (err) {
        statusText.textContent = "Ошибка отправки";
      }
    });

    document.getElementById("pushBtn").addEventListener("click", () => {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Notifications.requestPermission();
      });
    });

    document.getElementById("syncBtn").addEventListener("click", syncMessages);

    document.getElementById("settingsBtn").addEventListener("click", () => {
      accountInfo.textContent = `Вы вошли как: ${state.displayName} (${state.login})`;
      settingsModal.classList.add("open");
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      settingsModal.classList.remove("open");
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      settingsModal.classList.remove("open");
      try {
        await callApi({ action: "logout", token: state.token });
      } catch (e) {}
      state.token = "";
      state.messages = [];
      saveState();
      showAuthScreen();
    });

    document.getElementById("exportBackupBtn").addEventListener("click", () => {
      const dateStr = new Date().toISOString().slice(0, 10);
      const exportData = {
        exportedAt: new Date().toISOString(),
        messages: state.messages
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `enigma-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    const importFileInput = document.getElementById("importFileInput");
    document.getElementById("importBackupBtn").addEventListener("click", () => {
      importFileInput.click();
    });

    importFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (imported && Array.isArray(imported.messages)) {
            state.messages = imported.messages;
            saveState();
            renderMessages();
            alert("Резервная копия загружена на экран!");
          } else {
            alert("Неверный формат файла бэкапа.");
          }
        } catch (err) {
          alert("Ошибка чтения файла.");
        }
      };
      reader.readAsText(file);
      importFileInput.value = "";
    });

    if (state.gasUrl && state.token) {
      showChatScreen();
    } else {
      showAuthScreen();
    }
  </script>
</body>
</html>
