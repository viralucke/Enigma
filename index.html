<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Enigma</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "7a51e064-6201-45dc-86a3-a701e9f8ef12",
          serviceWorkerParam: { scope: "/Enigma/" },
          serviceWorkerPath: "OneSignalSDKWorker.js"
        });
      } catch (e) {
        console.warn("OneSignal init:", e);
      }
    });
  </script>
  <style>
    :root {
      --bg: #0b0d12;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(212, 175, 55, 0.22);
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.14);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --own-msg: rgba(212, 175, 55, 0.18);
      --other-msg: rgba(255, 255, 255, 0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #171c28, var(--bg) 60%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(11, 13, 18, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-soft);
    }
    .title-wrap h1 {
      font-size: 16px;
      letter-spacing: 1.5px;
      color: var(--gold);
    }
    .status {
      font-size: 11px;
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.97); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }
    .msg.own {
      align-self: flex-end;
      background: var(--own-msg);
      border-color: var(--glass-border);
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: var(--other-msg);
      border-bottom-left-radius: 4px;
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 4px;
      opacity: 0.85;
    }
    .msg-time { color: var(--muted); }
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      max-width: 260px;
      line-height: 1.5;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: rgba(11, 13, 18, 0.92);
      border-top: 1px solid var(--glass-border);
    }
    .composer input {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .composer input:focus { border-color: var(--gold); }
    .send-btn {
      background: var(--gold);
      color: #0b0d12;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 420px;
      background: #121620;
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90dvh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 17px;
      color: var(--gold);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      color: var(--muted);
    }
    .field input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn.primary {
      background: var(--gold);
      color: #0b0d12;
      border-color: var(--gold);
    }
    .divider {
      height: 1px;
      background: var(--glass-border);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div class="title-wrap">
        <h1>ENIGMA</h1>
        <div class="status" id="statusText">Локальный режим</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="pushBtn" title="Включить пуши">Уведомления</button>
      <button class="icon-btn" id="syncBtn" title="Обновить">↻</button>
      <button class="icon-btn" id="settingsBtn" title="Настройки и бэкап">⚙</button>
    </div>
  </header>

  <main id="messages">
    <div class="empty-state">Сообщений пока нет. Напиши первое сообщение или укажи ссылку на Google Таблицу в настройках (⚙).</div>
  </main>

  <form class="composer" id="chatForm">
    <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" required />
    <button type="submit" class="send-btn">→</button>
  </form>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h2>Настройки и резервное сохранение</h2>
      <div class="field">
        <label>Твоё имя в чате</label>
        <input type="text" id="userNameInput" placeholder="Например: Николай" />
      </div>
      <div class="field">
        <label>URL веб-приложения Google Apps Script</label>
        <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" />
      </div>
      <div class="btn-row">
        <button type="button" class="btn primary" id="saveSettingsBtn">Сохранить настройки</button>
      </div>

      <div class="divider"></div>
      <div class="field">
        <label>Резервное сохранение (файл .json на устройство)</label>
        <div class="btn-row">
          <button type="button" class="btn" id="exportBackupBtn">⬇ Скачать бэкап (.json)</button>
          <button type="button" class="btn" id="importBackupBtn">⬆ Восстановить из .json</button>
          <input type="file" id="importFileInput" accept=".json,application/json" style="display:none" />
        </div>
      </div>

      <div class="divider"></div>
      <button type="button" class="btn" id="closeModalBtn">Закрыть</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "enigma_state_v1";
    let state = {
      userName: "Николай",
      gasUrl: "",
      messages: []
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) state = { ...state, ...saved };
    } catch (e) {}

    const messagesEl = document.getElementById("messages");
    const statusText = document.getElementById("statusText");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const settingsModal = document.getElementById("settingsModal");
    const userNameInput = document.getElementById("userNameInput");
    const gasUrlInput = document.getElementById("gasUrlInput");

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">");
    }

    function renderMessages() {
      if (!state.messages.length) {
        messagesEl.innerHTML = '<div class="empty-state">Сообщений пока нет. Напиши первое сообщение или укажи ссылку на Google Таблицу в настройках (⚙).</div>';
        return;
      }
      messagesEl.innerHTML = state.messages.map(m => {
        const isOwn = m.author === state.userName;
        const time = m.time || "";
        return `
          <div class="msg ${isOwn ? "own" : "other"}">
            <div class="msg-meta">
              <span>${escapeHtml(m.author || "Участник")}</span>
              <span class="msg-time">${escapeHtml(time)}</span>
            </div>
            <div>${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join("");
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function syncMessages() {
      if (!state.gasUrl) {
        statusText.textContent = "Локальный режим";
        return;
      }
      statusText.textContent = "Синхронизация...";
      try {
        const res = await fetch(state.gasUrl + "?action=get");
        const data = await res.json();
        if (Array.isArray(data.messages)) {
          state.messages = data.messages;
          saveState();
          renderMessages();
        }
        statusText.textContent = "Подключено к Google Таблице";
      } catch (e) {
        statusText.textContent = "Ошибка связи с таблицей";
      }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = "";

      const now = new Date();
      const timeStr = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const msgObj = {
        id: Date.now().toString(),
        author: state.userName || "Николай",
        text,
        time: timeStr,
        iso: now.toISOString()
      };

      state.messages.push(msgObj);
      saveState();
      renderMessages();

      if (state.gasUrl) {
        statusText.textContent = "Отправка...";
        try {
          await fetch(state.gasUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "send", message: msgObj })
          });
          statusText.textContent = "Отправлено";
          setTimeout(syncMessages, 1200);
        } catch (err) {
          statusText.textContent = "Сохранено локально";
        }
      }
    });

    document.getElementById("pushBtn").addEventListener("click", () => {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Notifications.requestPermission();
      });
    });

    document.getElementById("syncBtn").addEventListener("click", syncMessages);

    document.getElementById("settingsBtn").addEventListener("click", () => {
      userNameInput.value = state.userName || "";
      gasUrlInput.value = state.gasUrl || "";
      settingsModal.classList.add("open");
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      settingsModal.classList.remove("open");
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      state.userName = userNameInput.value.trim() || "Николай";
      state.gasUrl = gasUrlInput.value.trim();
      saveState();
      renderMessages();
      settingsModal.classList.remove("open");
      syncMessages();
    });

    document.getElementById("exportBackupBtn").addEventListener("click", () => {
      const dateStr = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `enigma-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    const importFileInput = document.getElementById("importFileInput");
    document.getElementById("importBackupBtn").addEventListener("click", () => {
      importFileInput.click();
    });

    importFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (imported && Array.isArray(imported.messages)) {
            state = { ...state, ...imported };
            saveState();
            renderMessages();
            alert("Резервная копия успешно восстановлена!");
          } else {
            alert("Неверный формат файла резервной копии.");
          }
        } catch (err) {
          alert("Ошибка чтения файла бэкапа.");
        }
      };
      reader.readAsText(file);
      importFileInput.value = "";
    });

    renderMessages();
    if (state.gasUrl) {
      syncMessages();
      setInterval(syncMessages, 15000);
    }
  </script>
</body>
</html>
